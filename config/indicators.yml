# Indicator catalogue: the single definition of every published number.
#
# kind:
#   count       value = sum(column)
#   ratio       value = multiplier * sum(numerator) / sum(denominator)
#   growth      value = 100 * ((sum(numerator) / sum(denominator)) ^ (1 / years) - 1)
#   difference  value = indicator minuend - indicator subtrahend (same place)
#
# Province and Pakistan values are computed from summed numerators and
# denominators, never by averaging district rates.
# direction: "higher_better", "lower_better" or "neutral" (used only for colour).

- id: population
  label: "Population, 2023"
  theme: Population
  kind: count
  column: pop_total
  unit: people
  decimals: 0
  direction: neutral
  source: "Table 1"
  definition: "Persons enumerated in the 2023 census (headline count)."

- id: population_2017
  label: "Population, 2017"
  theme: Population
  kind: count
  column: pop_2017
  unit: people
  decimals: 0
  direction: neutral
  source: "Table 1"
  definition: "2017 census population, as re-tabulated by PBS on 2023 district boundaries."

- id: growth_rate
  label: "Annual population growth, 2017-2023"
  theme: Population
  kind: growth
  numerator: pop_total
  denominator: pop_2017
  years: 6
  unit: "% per year"
  decimals: 2
  direction: neutral
  source: "Table 1"
  definition: "Compound annual growth between the 2017 and 2023 counts over a six-year interval."

- id: area
  label: "Area"
  theme: Population
  kind: count
  column: area_km2
  unit: "km²"
  decimals: 0
  direction: neutral
  source: "Table 1"
  definition: "Area reported by PBS."

- id: density
  label: "Population density"
  theme: Population
  kind: ratio
  numerator: pop_total
  denominator: area_km2
  multiplier: 1
  unit: "people per km²"
  decimals: 0
  direction: neutral
  source: "Table 1"
  definition: "Population divided by reported area."

- id: urban_share
  label: "Urban population share"
  theme: Population
  kind: ratio
  numerator: pop_urban
  denominator: pop_total
  multiplier: 100
  unit: "%"
  decimals: 1
  direction: neutral
  source: "Table 1"
  definition: "Share of the population living in areas PBS classifies as urban."

- id: sex_ratio
  label: "Sex ratio"
  theme: Population
  kind: ratio
  numerator: pop_male
  denominator: pop_female
  multiplier: 100
  unit: "males per 100 females"
  decimals: 1
  direction: neutral
  source: "Table 1"
  definition: "Males per 100 females."

- id: household_size
  label: "Persons per household"
  theme: Population
  kind: ratio
  numerator: pop_total
  denominator: households
  multiplier: 1
  unit: persons
  decimals: 2
  direction: neutral
  source: "Tables 1 and 22"
  definition: "Population divided by the number of households in Tables 22-25. PBS publishes 6.33 nationally but does not state its method in these tables, so expect small differences from PBS's figures."

- id: literacy_rate
  label: "Literacy rate (10+)"
  theme: Education
  kind: ratio
  numerator: literate10_all
  denominator: pop10_all
  multiplier: 100
  unit: "%"
  decimals: 1
  direction: higher_better
  source: "Table 12"
  definition: "Literate persons aged 10 and over as a share of all persons aged 10 and over."

- id: literacy_rate_female
  label: "Female literacy rate (10+)"
  theme: Education
  kind: ratio
  numerator: literate10_female
  denominator: pop10_female
  multiplier: 100
