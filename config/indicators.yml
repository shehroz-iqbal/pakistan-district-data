  denominator: pop10_male
  multiplier: 100
  unit: "%"
  decimals: 1
  direction: higher_better
  source: "Table 12"
  definition: "Literate men and boys aged 10 and over as a share of all men and boys aged 10 and over."

- id: literacy_gender_gap
  label: "Literacy gender gap"
  theme: Education
  kind: difference
  minuend: literacy_rate_male
  subtrahend: literacy_rate_female
  unit: "percentage points"
  decimals: 1
  direction: lower_better
  source: "Table 12"
  definition: "Male minus female literacy rate (10+). Positive means men are ahead."

