# Source registry. Every input the pipeline reads is listed here, pinned to an
# exact upstream version. Checksums live in sources.lock.json (generated by
# `python -m pipeline.fetch --lock`); a normal fetch refuses files that differ.

census_2023:
  title: "7th Population and Housing Census 2023: district and tehsil tables"
  publisher: "Pakistan Bureau of Statistics (PBS)"
  publisher_url: "https://www.pbs.gov.pk/digital-census/detailed-results"
  published_format: "PDF (one file per table and province)"
  conversion:
    by: "Fahad Mirza"
    repo: "https://github.com/fahad-mirza/pakistan_census_2023_tables"
    license: "MIT"
    note: "PDF tables converted to CSV with Stata. Used unchanged; corrections are applied in this pipeline (config/fixes.yml)."
  pinned_commit: "887d7103294fc4b68f407586c21430c01f2a5dad"
  url_template: "https://raw.githubusercontent.com/fahad-mirza/pakistan_census_2023_tables/{commit}/{path}"
  provinces: [punjab, sindh, kp, balochistan, islamabad]
  district_tables:
    t01: "District Level Tables/table_01_{province}_district.csv"   # area, population, sex, urban/rural, growth
    t12: "District Level Tables/table_12_{province}_district.csv"   # literacy, population 10+
    t13a: "District Level Tables/table_13a_{province}_district.csv" # education by age bracket (cross-check only)
    t13b: "District Level Tables/table_13b_{province}_district.csv" # education by schooling-age bracket; source of the 5-16 population
    t16: "District Level Tables/table_16_{province}_district.csv"   # disability
    t20: "District Level Tables/table_20_{province}_district.csv"   # housing units by structure type
    t22: "District Level Tables/table_22_{province}_district.csv"   # lighting and cooking fuel
    t23: "District Level Tables/table_23_{province}_district.csv"   # drinking water
    t24: "District Level Tables/table_24_{province}_district.csv"   # toilets
    t25: "District Level Tables/table_25_{province}_district.csv"   # tenure, owner's sex, rooms
  tehsil_tables:
    t01_all: "District_Tehsil_Tables/table_01_{province}_all.csv"  # same as t01 plus province and sub-district rows

geoboundaries_pak:
  title: "geoBoundaries: Pakistan administrative boundaries (gbOpen)"
  publisher: "geoBoundaries, William & Mary geoLab"
  publisher_url: "https://www.geoboundaries.org/"
  pinned_commit: "5c25134028196d43ce97b5071934fd0cfc92f09f"
  url_template: "https://media.githubusercontent.com/media/wmgeolab/geoBoundaries/{commit}/{path}"
  files:
    adm3:
      path: "releaseData/gbOpen/PAK/ADM3/geoBoundaries-PAK-ADM3.geojson"
      level: "Tehsils (554 units)"
      upstream_source: "Pathways Data Pvt. Ltd., based on PBS census boundaries"
      license: "Open Data Commons Open Database License (ODbL) 1.0"
      role: "Building blocks: tehsil polygons are dissolved into 2023 census districts"
    adm2:
      path: "releaseData/gbOpen/PAK/ADM2/geoBoundaries-PAK-ADM2_simplified.geojson"
      level: "Districts, older vintage (126 units)"
      upstream_source: "geoBoundaries, Wikipedia"
      license: "Public domain"
      role: "Hint only: tells the matcher which older district each tehsil sat in"
